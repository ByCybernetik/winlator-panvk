# Сборка panvk-*.tzst в GitHub Actions (~30–60 мин, без RAM на ПК)

name: Build PanVK

on:
  workflow_dispatch:
  push:
    branches: [main, master, mali]
    paths:
      - 'panvk/**'
      - '.github/workflows/build-panvk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ninja-build cmake pkg-config python3-pip \
            llvm-dev libclang-dev spirv-tools libclc-20-dev libdrm-dev \
            zstd
          # Ubuntu 24.04 meson 1.3.x; Mesa 25.3+ needs >= 1.4
          sudo pip3 install --break-system-packages 'meson>=1.4.0'
          meson --version

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build PanVK tzst
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          JOBS: "2"
          BUILD_DIR: /tmp/panvk-build
          ASSET_DIR: ${{ github.workspace }}/output
        run: |
          chmod +x panvk/build-panvk.sh
          mkdir -p output
          panvk/build-panvk.sh
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: panvk-tzst
          path: output/panvk-*.tzst
          if-no-files-found: error
