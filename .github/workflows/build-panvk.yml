# Сборка panvk-*.tzst в GitHub Actions

name: Build PanVK

on:
  workflow_dispatch:
  push:
    branches: [main, master, mali]
    paths:
      - 'panvk/**'
      - '.github/workflows/build-panvk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          # libllvmspirvlib-* lives in universe
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ninja-build cmake pkg-config python3-pip \
            python3-mako python3-ply python3-yaml \
            llvm-18-dev clang-18 libclang-18-dev \
            spirv-tools libclc-20-dev libdrm-dev \
            libllvmspirvlib-18-dev \
            zstd
          sudo pip3 install --break-system-packages 'meson>=1.4.0'
          meson --version
          pkg-config --modversion libclc
          pkg-config --modversion LLVMSPIRVLib

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build PanVK tzst
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          JOBS: "2"
          BUILD_DIR: /tmp/panvk-build
          ASSET_DIR: ${{ github.workspace }}/output
        run: |
          chmod +x panvk/build-panvk.sh
          mkdir -p output
          panvk/build-panvk.sh
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: panvk-tzst
          path: output/panvk-*.tzst
          if-no-files-found: error
